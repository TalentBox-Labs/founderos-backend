name: Tests & Fixture Verification

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    # No Postgres service: the ordinary suite is SQLite-based via tests/conftest.py
    # (setdefault DATABASE_URL=sqlite…). Do not inject a non-TLS postgresql:// URL —
    # candidate fail-closed TLS validation correctly rejects that shape.
    # Do not inject secrets.TEST_SECRET_KEY: the audited repo secret was <32 chars and
    # blocked Settings import. Rely on conftest's ≥32 test-only SECRET_KEY default.

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt -r requirements-api.txt -r requirements-revenue.txt

    - name: Runtime Postgres driver smoke
      run: |
        python - << 'PY'
        import sqlalchemy
        from sqlalchemy import create_engine

        version = tuple(int(part) for part in sqlalchemy.__version__.split(".")[:2])
        if version >= (2, 1):
            raise SystemExit(
                f"sqlalchemy {sqlalchemy.__version__} is outside the declared <2.1 pin"
            )
        engine = create_engine("postgresql+psycopg2://user:x@127.0.0.1:1/db")
        module = engine.dialect.__class__.__module__
        engine.dispose()
        if "psycopg2" not in module:
            raise SystemExit(f"declared driver missing; dialect module={module}")
        print("RUNTIME_DRIVER_SMOKE", sqlalchemy.__version__, module)
        PY

    - name: Run tests
      run: |
        python -m pytest tests/ -v
      # Intentionally no SECRET_KEY / DATABASE_URL here.
      # tests/conftest.py setdefaults provide test-only values that satisfy
      # fail-closed validation without weakening production/staging contracts.

    - name: Verify fixture sync (no writes allowed)
      run: |
        python scripts/generate_week_fixtures.py --verify
      env:
        # Prevent accidental writes in CI
        CI: "true"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generate private local-only credentials
        run: python scripts/setup_local_env.py
      - name: Build the combined production image
        run: docker build -t founderos-local .
      - name: Verify the image excludes local secrets and Git metadata
        run: docker run --rm --entrypoint sh founderos-local -c 'test ! -e /app/.env && test ! -e /app/.git && test ! -e /app/.venv && test ! -e /app/frontend/.git'
      - name: Start the local TLS stack
        run: docker compose up --build -d --wait --wait-timeout 180 db redis api
      - name: Verify API, bundled frontend, TLS and worker configuration
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/app/
          docker compose exec -T api python -c 'from sqlalchemy import text; from revenue_os.database import engine; c = engine.connect(); assert c.execute(text("SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()")).scalar() is True; c.close()'
          docker compose run --rm --no-deps worker python -c 'from revenue_os.tasks import celery_app; assert celery_app.conf.broker_url == "redis://redis:6379/0"'
      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down --volumes
