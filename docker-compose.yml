# Local development only; production uses managed TLS PostgreSQL.
x-app-environment: &app-environment
  DATABASE_URL: postgresql://founderos:${POSTGRES_PASSWORD:?Run python scripts/setup_local_env.py}@db:5432/founderos?sslmode=require
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?Run python scripts/setup_local_env.py}
  RUNNER_API_KEY: ${RUNNER_API_KEY:?Run python scripts/setup_local_env.py}
  HEARTBEAT_ENABLED: "0"
  N8N_BRIDGE_ENABLED: "0"
  FOUNDER_OS_GMAIL_BETA_ENABLED: "0"
  FOUNDER_OS_REQUIRE_LOGIN: "true"
  FOUNDER_OS_COOKIE_SECURE: "false"

services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_DB: founderos
      POSTGRES_USER: founderos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_local_env.py}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderos -d founderos"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: founderos-local
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chroma_data:/app/data

  # Optional background processes require explicit opt-in for local work.
  worker:
    profiles: [background]
    image: founderos-local
    build: .
    command: celery -A revenue_os.tasks:celery_app worker --loglevel=info
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    profiles: [background]
    image: founderos-local
    build: .
    command: celery -A revenue_os.tasks:celery_app beat --loglevel=info
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  # Keep the old volume untouched: this uses a fresh local database after upgrade.
  pgdata:
    name: founderos_dev_tls_pgdata
  chroma_data:
